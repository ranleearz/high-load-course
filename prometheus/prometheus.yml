global:
  scrape_interval: 2s
  scrape_timeout: 1s

scrape_configs:
  - job_name: 'bombardier-docker-network-job'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['bombardier:1234']
  - job_name: 'online-store-job'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
